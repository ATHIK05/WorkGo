; ============================================================================
; WorkGo IVR Dialplan — /etc/asterisk/extensions.conf
;
; ARCHITECTURE:
;   1. Every inbound call hits [workgo-inbound] exten s.
;   2. Dynamically detects WSL Host Gateway IP so CURL reaches Windows Node backend.
;   3. We CURL /api/ivr/voice/inbound to get routing decision:
;        { action: "onboarding" }     -> new caller, collect details
;        { action: "toggle_menu" }    -> verified worker, show Online/Offline
;        { action: "pending_kyc" }    -> awaiting Peer KYC verification
;   4. Routes caller based on "action" field in response JSON.
; ============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
BACKEND_URL=http://localhost:3000

[workgo-inbound]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CALL_ID=${EPOCH})

 ; Dynamically detect WSL Host IP so Asterisk CURL reaches Windows backend port 3000
 same => n,Set(WSL_HOST=${SHELL(ip route | grep default | cut -d ' ' -f 3 | tr -d '\n')})
 same => n,GotoIf($["${WSL_HOST}" != ""]?has_gw:has_no_gw)
 same => n(has_gw),Set(BACKEND_URL=http://${WSL_HOST}:3000)
 same => n,Goto(do_backend_query)
 same => n(has_no_gw),Set(BACKEND_URL=http://localhost:3000)

  ; Step 1: Ask the backend who this caller is (request pipe-delimited text format)
  same => n(do_backend_query),NoOp(WorkGo IVR: Querying backend at ${BACKEND_URL} for caller: ${CALLER_NUM})
  same => n,Set(INBOUND_RESP=${CURL(${BACKEND_URL}/api/ivr/voice/inbound,caller=${CALLER_NUM}&format=text)})
  same => n,NoOp(Backend /inbound raw says: ${INBOUND_RESP})

  ; Parse ACTION and LANG using single-character pipe delimiter '|' and '='
  same => n,Set(FIELD1=${CUT(INBOUND_RESP,|,1)})
  same => n,Set(IVR_ACTION=${CUT(FIELD1,=,2)})
  same => n,Set(FIELD2=${CUT(INBOUND_RESP,|,2)})
  same => n,Set(WORKER_LANG=${CUT(FIELD2,=,2)})
  same => n,NoOp(Parsed IVR_ACTION = [${IVR_ACTION}], WORKER_LANG = [${WORKER_LANG}])

  ; Default language fallback
  same => n,GotoIf($["${WORKER_LANG}" != ""]?route_check)
  same => n,Set(WORKER_LANG=hi)

  ; Step 2: Route based on action (exact parsed match OR regex contains fallback)
  same => n(route_check),GotoIf($["${IVR_ACTION}" = "toggle_menu"]?toggle_menu)
  same => n,GotoIf($["${INBOUND_RESP}" : ".*toggle_menu.*"]?toggle_menu)
  same => n,GotoIf($["${IVR_ACTION}" = "pending_kyc"]?pending_kyc)
  same => n,GotoIf($["${INBOUND_RESP}" : ".*pending_kyc.*"]?pending_kyc)
  ; Default fallthrough: onboarding (new caller or incomplete profile)
  same => n,Goto(onboarding)

; ── TOGGLE MENU (verified worker) ────────────────────────────────────────────
 same => n(toggle_menu),NoOp(Verified worker - showing toggle menu in ${WORKER_LANG})
 same => n,Playback(workgo/toggle_menu_${WORKER_LANG})
 same => n,WaitExten(10)
 same => n,Hangup()

; ── PENDING KYC ──────────────────────────────────────────────────────────────
 same => n(pending_kyc),NoOp(Worker awaiting Peer KYC)
 same => n,Playback(workgo/pending_kyc_${WORKER_LANG})
 same => n,Wait(1)
 same => n,Hangup()

; ── ONBOARDING (new caller / incomplete profile) ──────────────────────────────
 same => n(onboarding),NoOp(New caller - starting onboarding flow)
 same => n(lang_menu),Playback(workgo/select_language_en)
 same => n,Read(LANG_DIGIT,,1,,,8)

 same => n,GotoIf($["${LANG_DIGIT}" = "1"]?lang_ta)
 same => n,GotoIf($["${LANG_DIGIT}" = "2"]?lang_hi)
 same => n,GotoIf($["${LANG_DIGIT}" = "3"]?lang_te)
 same => n,GotoIf($["${LANG_DIGIT}" = "4"]?lang_kn)
 same => n,GotoIf($["${LANG_DIGIT}" = "5"]?lang_ml)
 same => n,GotoIf($["${LANG_DIGIT}" = "6"]?lang_bn)
 same => n,GotoIf($["${LANG_DIGIT}" = "7"]?lang_mr)
 same => n,GotoIf($["${LANG_DIGIT}" = "8"]?lang_gu)
 same => n,GotoIf($["${LANG_DIGIT}" = "9"]?lang_pa)
 same => n,Goto(lang_en)

 same => n(lang_ta),Set(USER_LANG=ta)
 same => n,Goto(collect_details)
 same => n(lang_hi),Set(USER_LANG=hi)
 same => n,Goto(collect_details)
 same => n(lang_te),Set(USER_LANG=te)
 same => n,Goto(collect_details)
 same => n(lang_kn),Set(USER_LANG=kn)
 same => n,Goto(collect_details)
 same => n(lang_ml),Set(USER_LANG=ml)
 same => n,Goto(collect_details)
 same => n(lang_bn),Set(USER_LANG=bn)
 same => n,Goto(collect_details)
 same => n(lang_mr),Set(USER_LANG=mr)
 same => n,Goto(collect_details)
 same => n(lang_gu),Set(USER_LANG=gu)
 same => n,Goto(collect_details)
 same => n(lang_pa),Set(USER_LANG=pa)
 same => n,Goto(collect_details)
 same => n(lang_en),Set(USER_LANG=en)
 same => n,Goto(collect_details)

 same => n(collect_details),NoOp(Selected Language: ${USER_LANG})

 ; Step 1: Collect Name
 same => n,Playback(workgo/ask_name_${USER_LANG})
 same => n,Record(/tmp/workgo_${CALL_ID}_name:wav,2,7,k)

 ; Step 2: Collect Location
 same => n,Playback(workgo/ask_location_${USER_LANG})
 same => n,Record(/tmp/workgo_${CALL_ID}_location:wav,2,8,k)

 ; Step 3: Collect Pincode
 same => n,Playback(workgo/ask_pincode_${USER_LANG})
 same => n,Read(PINCODE_DIGITS,,6,,,12)

 ; Step 4: Collect Trade Description
 same => n,Playback(workgo/ask_trade_desc_${USER_LANG})
 same => n,Record(/tmp/workgo_${CALL_ID}_trade:wav,3,20,k)

 ; Step 5: Process with Python ASR + LLM + Backend
 same => n,System(python3 /var/lib/asterisk/sounds/workgo/transcribe_and_onboard.py "${CALLER_NUM}" "${USER_LANG}" "${PINCODE_DIGITS}" "/tmp/workgo_${CALL_ID}")

 ; Confirmation
 same => n,Playback(workgo/registration_done_${USER_LANG})
 same => n,Wait(1)
 same => n,Hangup()

; ── Worker pressed 1 -> Online ───────────────────────────────────────────────
exten => 1,1,NoOp(Worker ${CALLER_NUM} going ONLINE)
 same => n,Set(WSL_HOST=${SHELL(ip route | grep default | cut -d ' ' -f 3 | tr -d '\n')})
 same => n,GotoIf($["${WSL_HOST}" != ""]?has_gw1:has_no_gw1)
 same => n(has_gw1),Set(BACKEND_URL=http://${WSL_HOST}:3000)
 same => n,Goto(do_toggle1)
 same => n(has_no_gw1),Set(BACKEND_URL=http://localhost:3000)
 same => n(do_toggle1),Set(TOGGLE_RESP=${CURL(${BACKEND_URL}/api/ivr/voice/toggle-status,caller=${CALLER_NUM}&status=online)})
 same => n,NoOp(Toggle response: ${TOGGLE_RESP})
 same => n,GotoIf($["${WORKER_LANG}" != ""]?play_online)
 same => n,Set(WORKER_LANG=hi)
 same => n(play_online),Playback(workgo/online_confirmed_${WORKER_LANG})
 same => n,Wait(1)
 same => n,Hangup()

; ── Worker pressed 2 -> Offline ──────────────────────────────────────────────
exten => 2,1,NoOp(Worker ${CALLER_NUM} going OFFLINE)
 same => n,Set(WSL_HOST=${SHELL(ip route | grep default | cut -d ' ' -f 3 | tr -d '\n')})
 same => n,GotoIf($["${WSL_HOST}" != ""]?has_gw2:has_no_gw2)
 same => n(has_gw2),Set(BACKEND_URL=http://${WSL_HOST}:3000)
 same => n,Goto(do_toggle2)
 same => n(has_no_gw2),Set(BACKEND_URL=http://localhost:3000)
 same => n(do_toggle2),Set(TOGGLE_RESP=${CURL(${BACKEND_URL}/api/ivr/voice/toggle-status,caller=${CALLER_NUM}&status=offline)})
 same => n,NoOp(Toggle response: ${TOGGLE_RESP})
 same => n,GotoIf($["${WORKER_LANG}" != ""]?play_offline)
 same => n,Set(WORKER_LANG=hi)
 same => n(play_offline),Playback(workgo/offline_confirmed_${WORKER_LANG})
 same => n,Wait(1)
 same => n,Hangup()

; ── Routing entry points ──────────────────────────────────────────────────────
exten => 1000,1,Goto(workgo-inbound,s,1)
exten => workgo,1,Goto(workgo-inbound,s,1)
exten => 9080262334,1,Goto(workgo-inbound,s,1)
exten => _X.,1,Goto(workgo-inbound,s,1)

exten => t,1,Hangup()
exten => i,1,Hangup()

; ── Outbound Booking Alert Context ───────────────────────────────────────────
[workgo-booking-alert]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(${BOOKING_AUDIO})
 same => n,WaitExten(15)

exten => 1,1,NoOp(Worker accepting booking ${BOOKING_ID})
 same => n,Set(WSL_HOST=${SHELL(ip route | grep default | cut -d ' ' -f 3 | tr -d '\n')})
 same => n,GotoIf($["${WSL_HOST}" != ""]?has_gwc:has_no_gwc)
 same => n(has_gwc),Set(BACKEND_URL=http://${WSL_HOST}:3000)
 same => n,Goto(do_claim)
 same => n(has_no_gwc),Set(BACKEND_URL=http://localhost:3000)
 same => n(do_claim),Set(CLAIM_RESP=${CURL(${BACKEND_URL}/api/ivr/voice/claim-booking,caller=${WORKER_PHONE}&bookingId=${BOOKING_ID})})
 same => n,NoOp(Claim: ${CLAIM_RESP})
 same => n,Playback(workgo/booking_confirmed_en)
 same => n,Wait(1)
 same => n,Hangup()

exten => 2,1,Playback(workgo/booking_declined_en)
 same => n,Wait(1)
 same => n,Hangup()

exten => t,1,Hangup()
exten => i,1,Hangup()

; ── Booking Taken (Race Condition Redirect) ───────────────────────────────────
[workgo-booking-taken]
exten => s,1,Answer()
 same => n,Playback(workgo/booking_taken_en)
 same => n,Hangup()

; ── OTP Flash Call ────────────────────────────────────────────────────────────
[workgo-otp-flash]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(${OTP_AUDIO})
 same => n,Wait(1)
 same => n,Hangup()