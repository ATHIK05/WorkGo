name: workgo_admin_console
description: "WorkGo Cooperative Console — Admin/governance app for cooperative management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WorkGo shared core (path dep — PRD v2 Section 3)
  workgo_core:
    path: ../../packages/workgo_core

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5

  # Localization — view-layer .tr() on all SafeText strings
  easy_localization: ^3.0.8

  # Utilities
  auto_size_text: ^3.0.0
  provider: ^6.1.5
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
